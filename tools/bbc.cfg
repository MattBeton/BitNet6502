# Custom BBC Micro Model B (mode 7) linker config for cc65 -t none builds.
#
# Memory map assumptions:
#   $0000-$00FF  zero page (OS reserved; we steal $0070-$008F)
#   $0100-$01FF  6502 hardware stack
#   $0200-$0DFF  OS workspace, buffers
#   $0E00-$7BFF  user RAM (= 28,160 bytes, cassette filing system PAGE)
#   $7C00-$7FFF  mode 7 teletext screen RAM (1 KB)
#   $8000-$FFFF  sideways ROM / MOS
#
# MAIN ends at $7C00 (screen RAM boundary). The cc65 software stack lives in
# the top __STACKSIZE__ bytes of MAIN; __STACKSTART__ is the initial value of
# cc65's `sp` register (stack grows downward).

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400; # 1 KB software stack
    __STACKSTART__: type = export, value = $7C00;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0070, size = $0020;
    # Load at $1200 to dodge DFS most-actively-used workspace at $0E00-$11FF
    # (catalogue + sector buffers). Available main RAM: $1200 to $7C00 = $6A00 = 27,136 bytes.
    MAIN: file = %O, define = yes, start = $1200, size = $6A00 - __STACKSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro,  define   = yes;
    LOWCODE:  load = MAIN, type = ro,  optional = yes;
    ONCE:     load = MAIN, type = ro,  optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
