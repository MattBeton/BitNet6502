[project]
name = "bitnet6502"
version = "0.1.0"
description = "Tiny ternary-weight Mamba LM that runs on a 6502 (BBC Micro / Apple II)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "datasets>=2.0",
    "matplotlib>=3.5",
    "ipykernel>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that take > 30 s (deselect with '-m \"not slow\"')",
]
